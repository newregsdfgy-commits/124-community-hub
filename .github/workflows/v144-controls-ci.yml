name: v1.4.4 Player UI and input deep audit
on:
  push:
    branches:
      - v1.4.4-controls-player-ui-fix-test
    paths:
      - 'src/**'
      - 'Hub.lua'
      - 'Visuals.lua'
      - 'Start.lua'
      - 'tools/**'
      - 'tests/**'
      - '.github/workflows/v144-controls-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  input-player-weather:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify exact modules and all preserved regression tests
        run: |
          set -euo pipefail
          python3 tools/build_visuals.py --check
          python3 tools/verify_release.py
          node --test tests/EspKeyArchitecture130.test.cjs tests/Weapons2Compatibility.test.cjs tests/FullAudit131.test.cjs tests/PlayerVisuals140.test.cjs tests/DeepAudit141.test.cjs tests/UI142Layout.test.cjs tests/BoosterDeep143.test.cjs tests/ControlsPlayer144.test.cjs
      - name: Checkout official Luau compiler
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: master
          path: luau-source
          persist-credentials: false
      - name: Build Luau parser and executable runtime
        run: |
          set -euo pipefail
          cmake -S luau-source -B luau-build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build luau-build --target Luau.Compile.CLI Luau.Repl.CLI --parallel 2
      - name: Parse and binary compile both bundles and launcher
        run: |
          set -euo pipefail
          cmp Hub.lua Visuals.lua
          for source in Hub.lua Visuals.lua Start.lua; do
            ./luau-build/luau-compile --only-parse "$source" > /dev/null
            ./luau-build/luau-compile -O2 -g0 --binary "$source" > "/tmp/${source}.luauc"
            test -s "/tmp/${source}.luauc"
          done
          echo "PASS: v1.4.4 Luau source and launcher compile"
      - name: Execute actual UI input, weather, Player, ESP, Key and Booster source
        run: |
          set -euo pipefail
          python3 tests/build-controls144-runtime.py
          python3 tests/build-ui142-runtime.py
          python3 tests/build-player140-runtime.py
          python3 tests/build-booster143-runtime.py
          python3 tests/build-booster141-runtime.py
          python3 tests/build-131-runtime-audit.py
          ./luau-build/luau /tmp/Army124-Controls144.luau
          ./luau-build/luau /tmp/Army124-UI142.luau
          ./luau-build/luau /tmp/Army124-Player140.luau
          ./luau-build/luau /tmp/Army124-Booster143.luau
          ./luau-build/luau /tmp/Army124-Booster141.luau
          ./luau-build/luau /tmp/Army124-FullAudit131.luau
          echo "PASS: v1.4.4 Luau production callback integration"
