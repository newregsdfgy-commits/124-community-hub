name: 124 Community Visuals Luau compile
on:
  push:
    branches: [v1.1.19-community-visuals-ui-test, v1.1.20-performance-budget-test, v1.1.21-operator-ui-stability-test, v1.1.22-startup-check-test, v1.1.23-booster-stutter-test, v1.1.25-chat-permission-test, v1.1.26-booster-recovery-audit-test]
    paths:
      - 'Visuals.lua'
      - 'Hub.lua'
      - 'Start.lua'
      - 'tests/**'
      - '.github/workflows/luau-compile.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  luau-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout 124 Community Visuals test branch
        uses: actions/checkout@v4
      - name: Checkout official Luau compiler source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: master
          path: luau-source
          persist-credentials: false
      - name: Build Luau compiler
        shell: bash
        run: |
          cmake -S luau-source -B luau-build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build luau-build --target Luau.Compile.CLI --parallel 2
      - name: Run performance regression model tests
        shell: bash
        run: node --test tests/*.test.cjs
      - name: Parse and compile Visuals.lua and compatibility Hub.lua
        shell: bash
        run: |
          set -euo pipefail
          cmp -s Visuals.lua Hub.lua
          ./luau-build/luau-compile --only-parse Visuals.lua >/dev/null
          ./luau-build/luau-compile -O2 -g0 --binary Visuals.lua > /tmp/Army124-Visuals.luauc
          ./luau-build/luau-compile --only-parse Start.lua >/dev/null
          ./luau-build/luau-compile -O2 -g0 --binary Start.lua > /tmp/Army124-Start.luauc
          ./luau-build/luau-compile --only-parse Hub.lua >/dev/null
          ./luau-build/luau-compile -O2 -g0 --binary Hub.lua > /tmp/Army124-Hub.luauc
          test -s /tmp/Army124-Visuals.luauc
          test -s /tmp/Army124-Hub.luauc
          echo "124 Community Visuals parsed and compiled successfully."
