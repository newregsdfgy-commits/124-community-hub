name: v1.3.0 ESP Key modular release
on:
  push:
    branches:
      - v1.3.0-esp2-key2-modular-test
    paths:
      - 'src/**'
      - 'Hub.lua'
      - 'Visuals.lua'
      - 'Start.lua'
      - 'tools/**'
      - 'tests/EspKeyArchitecture130.test.cjs'
      - 'tests/Weapons2Compatibility.test.cjs'
      - '.github/workflows/v130-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  static-and-luau:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Deterministic bundle, release invariants, regressions
        run: |
          set -euo pipefail
          python3 tools/build_visuals.py --check
          python3 tools/verify_release.py
          node --test tests/Weapons2Compatibility.test.cjs tests/EspKeyArchitecture130.test.cjs
      - name: Checkout official Luau source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: master
          path: luau-source
          persist-credentials: false
      - name: Build official Luau compiler
        run: |
          cmake -S luau-source -B luau-build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build luau-build --target Luau.Compile.CLI --parallel 2
      - name: Parse/compile launch and generated entrypoints
        run: |
          set -euo pipefail
          cmp Hub.lua Visuals.lua
          for source in Hub.lua Visuals.lua Start.lua; do
            ./luau-build/luau-compile --only-parse "$source" >/dev/null
            ./luau-build/luau-compile -O2 -g0 --binary "$source" > "/tmp/${source}.luauc"
            test -s "/tmp/${source}.luauc"
          done
          echo "v1.3.0 Luau compiled successfully"
