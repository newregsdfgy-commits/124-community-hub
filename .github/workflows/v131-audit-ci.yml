name: v1.3.1 deep audit - static and executable Luau
on:
  push:
    branches:
      - v1.3.1-deep-audit-stability-test
    paths:
      - 'src/**'
      - 'Hub.lua'
      - 'Visuals.lua'
      - 'Start.lua'
      - 'tools/**'
      - 'tests/EspKeyArchitecture130.test.cjs'
      - 'tests/Weapons2Compatibility.test.cjs'
      - 'tests/FullAudit131.test.cjs'
      - 'tests/build-131-runtime-audit.py'
      - '.github/workflows/v131-audit-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deep-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Validate deterministic bundle and focused regressions
        run: |
          set -euo pipefail
          python3 tools/build_visuals.py --check
          python3 tools/verify_release.py
          node --test tests/EspKeyArchitecture130.test.cjs tests/Weapons2Compatibility.test.cjs tests/FullAudit131.test.cjs
      - name: Checkout Luau source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: master
          path: luau-source
          persist-credentials: false
      - name: Build Luau parser, compiler and runtime
        run: |
          set -euo pipefail
          cmake -S luau-source -B luau-build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build luau-build --target Luau.Compile.CLI Luau.Repl.CLI --parallel 2
      - name: Compile all entrypoints
        run: |
          set -euo pipefail
          cmp Hub.lua Visuals.lua
          for source in Hub.lua Visuals.lua Start.lua; do
            ./luau-build/luau-compile --only-parse "$source" >/dev/null
            ./luau-build/luau-compile -O2 -g0 --binary "$source" > "/tmp/${source}.luauc"
            test -s "/tmp/${source}.luauc"
          done
          echo "PASS: v1.3.1 Luau parser and compiler"
      - name: Execute extracted ESP and Key fault injection under Luau
        run: |
          set -euo pipefail
          python3 tests/build-131-runtime-audit.py
          ./luau-build/luau /tmp/Army124-FullAudit131.luau
          echo "PASS: runtime source-behavior fault injection"
