name: v1.4.0 Player visuals audit and Luau
on:
  push:
    branches:
      - v1.4.0-player-visuals-test
    paths:
      - 'src/**'
      - 'Hub.lua'
      - 'Visuals.lua'
      - 'Start.lua'
      - 'tools/**'
      - 'tests/EspKeyArchitecture130.test.cjs'
      - 'tests/Weapons2Compatibility.test.cjs'
      - 'tests/FullAudit131.test.cjs'
      - 'tests/PlayerVisuals140.test.cjs'
      - 'tests/build-131-runtime-audit.py'
      - 'tests/build-player140-runtime.py'
      - '.github/workflows/v140-ci.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  player-visuals-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Bundle, static release verification and regression tests
        run: |
          set -euo pipefail
          python3 tools/build_visuals.py --check
          python3 tools/verify_release.py
          node --test tests/EspKeyArchitecture130.test.cjs tests/Weapons2Compatibility.test.cjs tests/FullAudit131.test.cjs tests/PlayerVisuals140.test.cjs
      - name: Checkout official Luau source
        uses: actions/checkout@v4
        with:
          repository: luau-lang/luau
          ref: master
          path: luau-source
          persist-credentials: false
      - name: Build official compiler and CLI runtime
        run: |
          set -euo pipefail
          cmake -S luau-source -B luau-build -DCMAKE_BUILD_TYPE=Release -DLUAU_BUILD_TESTS=OFF
          cmake --build luau-build --target Luau.Compile.CLI Luau.Repl.CLI --parallel 2
      - name: Parse and compile 3 release entrypoints
        run: |
          set -euo pipefail
          cmp Hub.lua Visuals.lua
          for source in Hub.lua Visuals.lua Start.lua; do
            ./luau-build/luau-compile --only-parse "$source" > /dev/null
            ./luau-build/luau-compile -O2 -g0 --binary "$source" > "/tmp/${source}.luauc"
            test -s "/tmp/${source}.luauc"
          done
          echo "PASS: v1.4.0 Luau release parse/compile"
      - name: Execute isolated production ESP / Key and Player FX controllers
        run: |
          set -euo pipefail
          python3 tests/build-131-runtime-audit.py
          python3 tests/build-player140-runtime.py
          ./luau-build/luau /tmp/Army124-FullAudit131.luau
          ./luau-build/luau /tmp/Army124-Player140.luau
          echo "PASS: production callback fault-injection suites"
